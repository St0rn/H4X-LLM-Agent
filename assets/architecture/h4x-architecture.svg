<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="ttl desc">
<title id="ttl">H4X LLM Agent — Architecture</title>
<desc id="desc">H4X command line user connects to agent.py. Bootstrap hax.sh starts local services. Agent communicates bidirectionally with Ollama Qwen2.5, queries conversation memory and technical RAG, and invokes Kali MCP and MetasploitMCP through safeguarded tools. Results return to the operator.</desc>
